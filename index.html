  <style id="tilos-round-face-fix">
    .staff-mode .staff-face-panel .home-evia-space{display:grid!important;place-items:center!important;min-height:132px!important}
    .staff-mode .staff-face-panel .home-evia-stage{position:relative!important;display:grid!important;place-items:center!important;width:130px!important;height:130px!important;min-width:130px!important;max-width:130px!important;min-height:130px!important;max-height:130px!important;aspect-ratio:1/1!important;margin:0 auto!important;flex:none!important}
    .staff-mode .staff-face-panel .home-evia-stage>#eviaFace.evia-face{position:relative!important;inset:auto!important;width:104px!important;height:104px!important;min-width:104px!important;max-width:104px!important;min-height:104px!important;max-height:104px!important;aspect-ratio:1/1!important;box-sizing:border-box!important;padding:0!important;margin:0!important;border-radius:50%!important;flex:0 0 104px!important;align-self:center!important;justify-self:center!important}
    #staffApp>.selected-learner,#staffApp>.staff-stats,#staffApp>.staff-actions,#staffApp>.staff-action.compact,#staffApp>.pa-home{display:none!important}
    #settingsButton{display:none!important}
    .staff-mode .app-header{align-items:flex-start!important}
    .staff-mode .app-brand{display:grid!important;justify-items:start!important;gap:2px!important}
    .staff-mode .header-actions{align-items:flex-start!important}
    .assessor-label{display:block!important;margin-top:4px!important;font-size:10px!important;font-weight:800!important;letter-spacing:.04em!important;line-height:1.15!important;color:#718096!important;text-transform:none!important}
    .header-utility-actions{display:flex!important;justify-content:flex-start!important;gap:11px!important;white-space:nowrap!important;margin-top:1px!important}
    .header-utility-actions button{border:0!important;background:transparent!important;padding:1px 0!important;color:#6f797e!important;font:inherit!important;font-size:10px!important;line-height:1.2!important}
    .header-utility-actions button:active{color:#2583a7}
  </style>
  <meta name="tilos-build" content="47-auto-mode-glasses">

<body class="staff-mode">
  <main>
    <header class="app-header"><div class="app-brand"><b class="brand-word" aria-label="Andros">Andr<span class="brand-o" aria-hidden="true">o</span>s</b><small class="assessor-label">Assessor assistant</small><nav class="header-utility-actions" aria-label="Andros help and assessor profile"><button type="button" data-v33-help>Help/Andros</button><button type="button" data-v33-profile>Profile</button></nav></div><div class="header-actions"><button id="installApp" class="install-button" type="button">Install</button><button id="settingsButton" class="header-icon" type="button" aria-label="Assessor profile and settings" hidden>i</button></div></header>

    <section id="staffApp" aria-live="polite"></section>
  </main>
  <section class="evia-overlay" id="tilosOverlay" aria-hidden="true" aria-label="Andros assessor assistant"><div class="evia-wizard" role="dialog" aria-modal="true" aria-labelledby="tilosPrompt"><div class="evia-toolbar"><span></span><button id="tilosClose" type="button" aria-label="Close Andros">&#215;</button></div><div class="evia-stage"><div class="evia-face" aria-hidden="true"><div class="evia-eyes"><span class="evia-eye eye-left"></span><span class="evia-eye eye-right"></span></div></div></div><div class="evia-copy" aria-live="polite"><p class="evia-greeting">Andros</p><h2 id="tilosPrompt">What would you like to do?</h2><p id="tilosHint">Assessor workspace.</p></div><div id="tilosContent"></div></div></section>
